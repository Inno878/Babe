<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Proposal</title>
  <link rel="stylesheet" href="style.css">

<style>
  body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: pink;
      margin: 0;
      padding: 0;
  }
  .popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 300px;
  }
  .popup input, .popup textarea {
      width: 100%;
      margin: 10px 0;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
  }
  .popup button {
      background: red;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      border-radius: 5px;
  }
  .popup button:hover {
      background: darkred;
  }
  .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
  }
</style>

<body>
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="story.html">Our Love Story</a>
    <a href="proposal.html">The Proposal</a>
  </div>
  <div class="container">
    <h1>The Proposal</h1>
    <p>I was trying to come up with something clever, but honestly, nothing is as sweet as just asking…</p>

    <p>Will you be my Valentine? 🥰💌</p>

    <p>I promise flowers, laughter, and all the cuddles you can handle. 💕✨</p>

    <p>So what do you say?</p>

    <button class="button" onclick= "alert('You cant say no cause We Stuck in Love with eachother')">Yes</button> 
    <button class="button" onclick="alert('Haha jokes of you for even thinking of it 😂😂')">No</button>
  </div>

  <button onclick="openPopup()">Send a Love Note</button>

  <div class="overlay" id="overlay"></div>

  <div class="popup" id="popup">
      <h2>Send Me an Email 💌</h2>
           <textarea id="message" placeholder="Your sweet message..."></textarea>
      <button onclick="sendEmail()">Send</button>
      <button onclick="closePopup()">Close</button>
  </div>
  <div>
    <form action="https://formsubmit.co/your-email@example.com" method="POST">
    <input type="text" name="name" placeholder="Your Name" required>
    <textarea name="message" placeholder="Your sweet message..." required></textarea>
    <button type="submit">Send Email</button>
  </form>
</div>
